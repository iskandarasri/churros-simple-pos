<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes"
    />
    <title>Churros · POS System</title>
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
        -webkit-tap-highlight-color: transparent;
      }

      body {
        background: #bb1c07;
        font-family:
          -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica,
          Arial, sans-serif;
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        margin: 0;
        padding: 8px;
        transition: background 0.3s ease;
      }

      /* DARK MODE - IMPROVED READABILITY */
      body.dark-mode {
        background: #1a1a1a;
      }

      body.dark-mode .phone-app {
        background: #2d2d2d;
        box-shadow:
          0 25px 40px rgba(0, 0, 0, 0.8),
          0 0 0 8px #444 inset;
        border-color: #666;
      }

      body.dark-mode .logo-section {
        background: #333;
        border-color: #666;
      }

      body.dark-mode .logo-placeholder {
        color: #ff8a8a;
      }

      body.dark-mode .churros-header {
        background: #444;
      }

      body.dark-mode .churros-header h2 {
        color: #ffffff;
        text-shadow: 2px 2px 0 #000;
      }

      body.dark-mode .calc-screen,
      body.dark-mode .order-summary,
      body.dark-mode .dashboard-card,
      body.dark-mode .staff-section,
      body.dark-mode .payment-summary,
      body.dark-mode .remarks-section {
        background: #3a3a3a;
        border-color: #666;
      }

      body.dark-mode .summary-header,
      body.dark-mode .order-total span,
      body.dark-mode .payment-label,
      body.dark-mode .current-staff {
        color: #ffffff;
      }

      body.dark-mode .order-item {
        background: rgba(255, 255, 255, 0.1);
        color: #ffffff;
      }

      body.dark-mode .order-item span {
        color: #ffffff;
      }

      body.dark-mode #result {
        background: #222;
        color: #ffffff;
        border-color: #666;
      }

      body.dark-mode .key {
        background: #444;
        color: #ffffff;
        border-color: #666;
      }

      body.dark-mode .key.operator {
        background: #555;
        color: #ffffff;
      }

      body.dark-mode .dashboard-card .value {
        color: #ffffff;
      }

      body.dark-mode .dashboard-card .label {
        color: #ffb3b3;
      }

      body.dark-mode .payment-value {
        color: #ffb3b3;
      }

      body.dark-mode .order-total {
        color: #ffb3b3;
      }

      body.dark-mode .footer-badge {
        background: #444;
        color: #ffffff;
      }

      body.dark-mode .staff-input,
      body.dark-mode .remarks-input {
        background: #222;
        color: #ffffff;
        border-color: #666;
      }

      body.dark-mode .staff-input::placeholder,
      body.dark-mode .remarks-input::placeholder {
        color: #aaa;
      }

      .phone-app {
        max-width: 400px;
        width: 100%;
        background: #94642f;
        border-radius: 48px 48px 32px 32px;
        box-shadow:
          0 25px 40px rgba(0, 0, 0, 0.4),
          0 0 0 8px #821e0e inset;
        padding: 20px 16px 25px 16px;
        border: 2px solid #e0a94b;
        transition: all 0.3s ease;
      }

      /* Header with dark mode toggle */
      .app-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 15px;
      }

      .dark-toggle {
        background: #be4841;
        border: none;
        border-radius: 30px;
        padding: 8px 16px;
        color: white;
        font-weight: 700;
        cursor: pointer;
        box-shadow: 0 3px 0 #821e0e;
      }

      .dark-toggle:active {
        transform: translateY(2px);
        box-shadow: 0 1px 0 #821e0e;
      }

      /* Staff Login Section */
      .staff-section {
        background: #d89f91;
        border-radius: 20px;
        padding: 12px;
        margin-bottom: 15px;
        border: 2px solid #e0a94b;
      }

      .staff-header {
        display: flex;
        gap: 8px;
        margin-bottom: 8px;
      }

      .staff-input {
        flex: 1;
        padding: 10px;
        border-radius: 15px;
        border: 2px solid #821e0e;
        font-size: 0.9rem;
      }

      .staff-btn {
        background: #be4841;
        color: white;
        border: none;
        border-radius: 15px;
        padding: 10px 15px;
        font-weight: 700;
        cursor: pointer;
        box-shadow: 0 3px 0 #821e0e;
      }

      .staff-btn:active {
        transform: translateY(2px);
        box-shadow: 0 1px 0 #821e0e;
      }

      .current-staff {
        font-weight: 600;
        color: #462a1a;
        padding: 5px;
      }

      /* Logo Section */
      .logo-section {
        background: #be1b08;
        border-radius: 30px;
        padding: 15px;
        margin-bottom: 15px;
        text-align: center;
        border: 3px solid #821e0e;
        box-shadow: 0 6px 0 #821e0e;
      }
      .logo-preview {
        max-width: 100%;
        max-height: 70px;
        object-fit: contain;
      }
      .logo-placeholder {
        color: #c31f0a;
        font-size: 1.8rem;
        font-weight: 800;
        padding: 10px;
        text-transform: uppercase;
        letter-spacing: 2px;
      }

      .churros-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        background: #be4841;
        padding: 12px 20px;
        border-radius: 50px;
        margin-bottom: 15px;
        box-shadow: 0 6px 0 0 #821e0e;
      }
      .churros-header h2 {
        font-size: 1.5rem;
        font-weight: 800;
        letter-spacing: 1px;
        color: #f4f1e9;
        text-shadow: 2px 2px 0 #462a1a;
      }
      .churros-header span {
        background: #e1100b;
        font-size: 2rem;
        padding: 0 12px 6px 12px;
        border-radius: 40px;
        line-height: 1;
        color: #f4f1e9;
        box-shadow: 0 3px 0 #821e0e;
      }

      .calc-screen {
        background: #d89f91;
        border-radius: 30px;
        padding: 12px 16px;
        box-shadow:
          inset 0 3px 8px rgba(0, 0, 0, 0.2),
          0 6px 0 #821e0e;
        margin-bottom: 15px;
        border: 2px solid #e0a94b;
      }
      #result {
        font-size: 3.2rem;
        font-weight: 800;
        text-align: right;
        color: #462a1a;
        line-height: 1.2;
        word-wrap: break-word;
        min-height: 4rem;
        background: #f4f1e9;
        padding: 12px 15px;
        border-radius: 20px;
        border: 2px solid #c31f0a;
        font-family: "Courier New", monospace;
        box-shadow: inset 0 2px 5px rgba(0, 0, 0, 0.1);
      }

      /* Dashboard Cards */
      .dashboard {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 8px;
        margin-bottom: 15px;
      }
      .dashboard-card {
        background: #d89f91;
        border-radius: 20px;
        padding: 12px 5px;
        text-align: center;
        border: 2px solid #e0a94b;
        box-shadow: 0 4px 0 #821e0e;
      }
      .dashboard-card .value {
        font-size: 1.4rem;
        font-weight: 800;
        color: #462a1a;
      }
      .dashboard-card .label {
        font-size: 0.75rem;
        font-weight: 600;
        color: #821e0e;
        text-transform: uppercase;
      }

      /* Order Summary Panel */
      .order-summary {
        background: #d89f91;
        border-radius: 25px;
        padding: 15px;
        margin-bottom: 15px;
        border: 2px solid #e0a94b;
        box-shadow: 0 4px 0 #821e0e;
      }
      .summary-header {
        display: flex;
        justify-content: space-between;
        color: #462a1a;
        font-weight: 700;
        margin-bottom: 10px;
        font-size: 0.9rem;
        padding: 0 5px;
      }
      #order-list {
        max-height: 130px;
        overflow-y: auto;
        margin-bottom: 10px;
        font-size: 0.95rem;
        background: rgba(244, 241, 233, 0.3);
        border-radius: 15px;
        padding: 8px;
      }
      .order-item {
        display: flex;
        justify-content: space-between;
        padding: 6px 8px;
        border-bottom: 1px dashed #c31f0a;
        background: rgba(244, 241, 233, 0.5);
        border-radius: 10px;
        margin-bottom: 4px;
      }
      .order-total {
        display: flex;
        justify-content: space-between;
        font-weight: 800;
        color: #821e0e;
        font-size: 1.3rem;
        border-top: 3px solid #c31f0a;
        padding: 10px 5px 0 5px;
      }

      /* Payment Summary */
      .payment-summary {
        background: #d89f91;
        border-radius: 20px;
        padding: 12px;
        margin-bottom: 15px;
        border: 2px solid #e0a94b;
      }

      .payment-row {
        display: flex;
        justify-content: space-between;
        margin-bottom: 8px;
        font-size: 1.1rem;
      }

      .payment-label {
        font-weight: 600;
        color: #462a1a;
      }

      .payment-value {
        font-weight: 800;
        color: #821e0e;
      }

      .payment-change {
        font-size: 1.4rem;
        color: #c31f0a;
        border-top: 2px solid #821e0e;
        padding-top: 8px;
        margin-top: 5px;
      }

      /* Remarks Section */
      .remarks-section {
        background: #d89f91;
        border-radius: 20px;
        padding: 12px;
        margin-bottom: 15px;
        border: 2px solid #e0a94b;
      }

      .remarks-input {
        width: 100%;
        padding: 10px;
        border-radius: 15px;
        border: 2px solid #821e0e;
        font-size: 0.9rem;
        margin-bottom: 8px;
      }

      .meal-presets {
        display: grid;
        grid-template-columns: repeat(2, 1fr);
        gap: 20px; /* Increased space between buttons */
        margin-bottom: 20px;
        padding: 0 5px;
      }

      .meal-btn {
        background: #be4841;
        border: none;
        border-radius: 20px; /* Square-ish rounded corners, not oval */
        padding: 20px 10px 15px 10px;
        box-shadow:
          0 6px 0 #821e0e,
          0 8px 15px rgba(0, 0, 0, 0.3);
        border: 2px solid #e0a94b;
        cursor: pointer;
        transition: all 0.05s ease;
        width: 100%;
        aspect-ratio: 1/1; /* Makes buttons square */
        display: flex;
        align-items: center;
        justify-content: center;
      }

      .btn-content {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 8px;
        width: 100%;
      }

      .btn-icon {
        width: 90px; /* Larger icon for square buttons */
        height: 90px;
        object-fit: contain;
      }

      .set-name {
        font-size: 1.3rem;
        font-weight: 800;
        color: #f4f1e9;
        line-height: 1.2;
        text-align: center;
      }

      .meal-btn:active {
        transform: translateY(4px);
        box-shadow: 0 2px 0 #821e0e;
      }

      /* Dark mode support */
      body.dark-mode .set-name {
        color: #ffffff;
      }
      .quick-panel {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 8px;
        margin-bottom: 15px;
      }

      .note-btn {
        background: #e0a94b;
        border: none;
        border-radius: 40px;
        padding: 16px 0;
        font-size: 1.2rem;
        font-weight: 800;
        color: #462a1a;
        box-shadow:
          0 5px 0 #94642f,
          0 6px 12px rgba(0, 0, 0, 0.2);
        border: 2px solid #f4f1e9;
        cursor: pointer;
        font-family: inherit;
        transition: all 0.05s ease;
      }

      .note-btn:active {
        transform: translateY(3px);
        box-shadow: 0 2px 0 #94642f;
      }

      .keypad {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 8px;
        margin-bottom: 15px;
      }

      .key {
        background: #f4f1e9;
        border: none;
        border-radius: 25px;
        padding: 20px 0;
        font-size: 1.8rem;
        font-weight: 700;
        color: #462a1a;
        box-shadow:
          0 5px 0 #94642f,
          0 6px 12px rgba(0, 0, 0, 0.15);
        border: 2px solid #e0a94b;
        cursor: pointer;
        font-family: inherit;
        transition: all 0.05s ease;
        grid-column: span 1;
      }

      .key.operator {
        background: #d89f91;
        color: #462a1a;
        font-size: 2rem;
      }

      .key.zero {
        grid-column: span 2;
      }

      .key:active {
        transform: translateY(3px);
        box-shadow: 0 2px 0 #94642f;
      }

      .key.equals-key {
        grid-column: span 4;
        background: #be4841;
        color: #f4f1e9;
        font-size: 2rem;
        padding: 20px 0;
        box-shadow:
          0 5px 0 #821e0e,
          0 6px 12px rgba(0, 0, 0, 0.15);
        border: 2px solid #e0a94b;
      }

      .key.equals-key:active {
        transform: translateY(3px);
        box-shadow: 0 2px 0 #821e0e;
      }

      .key.clear-key {
        grid-column: span 4;
        background: #e1100b;
        color: #f4f1e9;
        font-size: 1.8rem;
        padding: 20px 0;
        box-shadow:
          0 5px 0 #821e0e,
          0 6px 12px rgba(0, 0, 0, 0.15);
        border: 2px solid #e0a94b;
      }

      .key.clear-key:active {
        transform: translateY(3px);
        box-shadow: 0 2px 0 #821e0e;
      }

      .pos-actions {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 8px;
        margin: 15px 0;
      }

      .pos-btn {
        background: #be4841;
        color: #f4f1e9;
        border: none;
        border-radius: 30px;
        padding: 16px 0;
        font-size: 1rem;
        font-weight: 700;
        box-shadow: 0 4px 0 #821e0e;
        border: 2px solid #e0a94b;
        cursor: pointer;
        transition: all 0.05s ease;
      }

      .pos-btn.special {
        background: #e0a94b;
        color: #462a1a;
      }

      .pos-btn:active {
        transform: translateY(3px);
        box-shadow: 0 1px 0 #821e0e;
      }

      /* Receipt Modal */
      .receipt-modal {
        display: none;
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
        background: rgba(0, 0, 0, 0.5);
        justify-content: center;
        align-items: center;
        z-index: 1000;
      }

      .receipt-content {
        background: #f4f1e9;
        max-width: 350px;
        width: 90%;
        border-radius: 30px;
        padding: 25px 20px;
        border: 3px solid #821e0e;
      }

      .receipt-header {
        text-align: center;
        margin-bottom: 20px;
      }

      .receipt-details {
        border-top: 2px dashed #821e0e;
        border-bottom: 2px dashed #821e0e;
        padding: 15px 0;
        margin-bottom: 15px;
      }

      .receipt-title {
        width: 120px;
        height: auto;
        display: block;
        margin-left: auto;
        margin-right: auto;
      }

      .receipt-item {
        display: flex;
        justify-content: space-between;
        margin-bottom: 8px;
      }

      .receipt-total {
        font-size: 1.4rem;
        font-weight: 800;
        color: #821e0e;
        text-align: right;
        margin-bottom: 15px;
      }

      .receipt-footer {
        text-align: center;
        font-style: italic;
      }

      .close-receipt {
        background: #be4841;
        color: white;
        border: none;
        border-radius: 30px;
        padding: 12px 30px;
        font-weight: 700;
        margin-top: 15px;
        cursor: pointer;
      }

      /* Daily Report Modal */
      .report-modal {
        display: none;
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
        background: rgba(0, 0, 0, 0.5);
        justify-content: center;
        align-items: center;
        z-index: 1000;
      }

      .report-content {
        background: #f4f1e9;
        max-width: 380px;
        width: 95%;
        border-radius: 30px;
        padding: 25px 20px;
        border: 3px solid #821e0e;
        max-height: 80vh;
        overflow-y: auto;
      }

      .footer-badge {
        text-align: center;
        color: #f4f1e9;
        font-weight: 600;
        font-size: 0.9rem;
        background: #be4841;
        padding: 12px;
        border-radius: 60px;
        border: 2px solid #e0a94b;
        margin-top: 15px;
        box-shadow: 0 4px 0 #821e0e;
      }

      /* Dark mode specific fixes for modals */
      body.dark-mode .receipt-content,
      body.dark-mode .report-content {
        background: #333;
        color: #ffffff;
      }

      body.dark-mode .receipt-title {
        color: #ff8a8a;
      }

      body.dark-mode .receipt-details {
        border-color: #666;
      }

      body.dark-mode .receipt-item {
        color: #ffffff;
      }

      body.dark-mode .receipt-total {
        color: #ffb3b3;
      }

      body.dark-mode .receipt-footer {
        color: #ffffff;
      }
    </style>
  </head>
  <body>
    <div class="phone-app">
      <!-- Header with Dark Mode Toggle -->
      <div class="app-header">
        <div></div>
        <button class="dark-toggle" id="darkModeToggle">🌙 Dark Mode</button>
      </div>

      <!-- Logo Section -->
      <div class="logo-section">
        <img src="logo-new.png" class="logo-preview" alt="Churros Logo" />
      </div>

      <!-- Staff Login Section -->
      <div class="staff-section">
        <div class="staff-header">
          <input
            type="text"
            id="staffName"
            class="staff-input"
            placeholder="Enter staff name"
            value="Cashier 1"
          />
          <button class="staff-btn" id="staffLogin">Login</button>
        </div>
        <div class="current-staff" id="currentStaff">👤 Current: Cashier 1</div>
      </div>

      <!-- Dashboard -->
      <div class="dashboard">
        <div class="dashboard-card">
          <div class="value" id="today-total">RM0</div>
          <div class="label">TODAY</div>
        </div>
        <div class="dashboard-card">
          <div class="value" id="total-sales">0</div>
          <div class="label">SALES</div>
        </div>
        <div class="dashboard-card">
          <div class="value" id="total-items">0</div>
          <div class="label">ITEMS</div>
        </div>
      </div>

      <!-- Order Summary -->
      <div class="order-summary">
        <div class="summary-header">
          <span>Current Order</span>
          <span>Qty</span>
        </div>
        <div id="order-list"></div>
        <div class="order-total">
          <span>Total:</span>
          <span id="order-total-amount">RM 0.00</span>
        </div>
      </div>

      <!-- Payment Summary - Shows what customer paid and change -->
      <div class="payment-summary">
        <div class="payment-row">
          <span class="payment-label">Customer Paid:</span>
          <span class="payment-value" id="paid-amount">RM 0.00</span>
        </div>
        <div class="payment-row payment-change">
          <span class="payment-label">Change to Return:</span>
          <span class="payment-value" id="change-amount">RM 0.00</span>
        </div>
      </div>

      <!-- Remarks Section -->
      <div class="remarks-section">
        <input
          type="text"
          id="saleRemarks"
          class="remarks-input"
          placeholder="Add notes (e.g., Extra churros, No sugar)"
        />
      </div>

      <!-- Meal Buttons - Mr. Churros Style with Icon -->
      <div class="meal-presets">
        <button class="meal-btn" id="meal-single">
          <div class="btn-content">
            <img src="single.png" class="btn-icon" alt="icon" />
            <span class="set-name">Single set</span>
          </div>
        </button>
        <button class="meal-btn" id="meal-family">
          <div class="btn-content">
            <img src="family.png" class="btn-icon" alt="icon" />
            <span class="set-name">Family set</span>
          </div>
        </button>
      </div>

      <!-- Calculator Screen - Shows what customer paid (MANUAL INPUT) -->
      <div class="calc-screen">
        <div id="result">0</div>
      </div>

      <!-- Cash Notes - Quick buttons for common cash amounts -->
      <div class="quick-panel">
        <button class="note-btn" id="note-10">RM10</button>
        <button class="note-btn" id="note-20">RM20</button>
        <button class="note-btn" id="note-50">RM50</button>
        <button class="note-btn" id="note-100">RM100</button>
      </div>

      <!-- Calculator Keypad - For MANUAL ENTRY of any amount (RM25, RM43, etc) -->
      <div class="keypad">
        <button class="key" data-num="7">7</button>
        <button class="key" data-num="8">8</button>
        <button class="key" data-num="9">9</button>
        <button class="key operator" data-op="+">+</button>

        <button class="key" data-num="4">4</button>
        <button class="key" data-num="5">5</button>
        <button class="key" data-num="6">6</button>
        <button class="key operator" data-op="-">−</button>

        <button class="key" data-num="1">1</button>
        <button class="key" data-num="2">2</button>
        <button class="key" data-num="3">3</button>
        <button class="key operator" data-op="*">×</button>

        <button class="key zero" data-num="0">0</button>
        <button class="key" data-num=".">.</button>
        <button class="key operator divide-key" data-op="/">÷</button>

        <button class="key equals-key" id="equals-btn">=</button>
        <button class="key clear-key" id="clear-btn">CLEAR</button>
      </div>

      <!-- POS Actions -->
      <div class="pos-actions">
        <button class="pos-btn" id="save-sale">💾 Save & Receipt</button>
        <button class="pos-btn" id="void-last">↩️ Void Last</button>
        <button class="pos-btn" id="clear-order">🗑️ Clear</button>
      </div>

    <div class="report-modal" id="reportModal">
      <div class="report-content">
        <h2 style="color: #c31f0a; margin-bottom: 20px">📊 Daily Report</h2>
        <div id="reportDate"></div>
        <div style="margin: 20px 0" id="reportStats"></div>
        <div id="reportSalesList"></div>
        <button
          class="close-receipt"
          onclick="
            document.getElementById('reportModal').style.display = 'none'
          "
        >
          Close
        </button>
      </div>
    </div>

    <script>
      (function () {
        // ========== STATE ==========
        let currentInput = "0"; // Shows what customer paid (manual or quick button)
        let previousOperand = null;
        let operator = null;
        let shouldResetScreen = false;

        let cashAmount = null; // Amount customer paid
        let currentOrder = [];
        let allSales = [];

        let currentStaff = "Cashier 1";
        let darkMode = localStorage.getItem("darkMode") === "true";

        // Load saved sales
        try {
          const saved = localStorage.getItem("churrosSales");
          if (saved) {
            allSales = JSON.parse(saved);
          }
        } catch (e) {
          console.log("No saved data");
        }

        // ========== DOM ELEMENTS ==========
        const resultEl = document.getElementById("result");
        const orderListEl = document.getElementById("order-list");
        const orderTotalEl = document.getElementById("order-total-amount");
        const paidAmountEl = document.getElementById("paid-amount");
        const changeAmountEl = document.getElementById("change-amount");
        const todayTotalEl = document.getElementById("today-total");
        const totalSalesEl = document.getElementById("total-sales");
        const totalItemsEl = document.getElementById("total-items");
        const saleRemarks = document.getElementById("saleRemarks");
        const currentStaffEl = document.getElementById("currentStaff");
        const staffNameInput = document.getElementById("staffName");

        // ========== DARK MODE ==========
        function applyDarkMode() {
          if (darkMode) {
            document.body.classList.add("dark-mode");
            document.getElementById("darkModeToggle").textContent =
              "☀️ Light Mode";
          } else {
            document.body.classList.remove("dark-mode");
            document.getElementById("darkModeToggle").textContent =
              "🌙 Dark Mode";
          }
          localStorage.setItem("darkMode", darkMode);
        }

        document
          .getElementById("darkModeToggle")
          .addEventListener("click", () => {
            darkMode = !darkMode;
            applyDarkMode();
          });

        applyDarkMode();

        // ========== STAFF LOGIN ==========
        document.getElementById("staffLogin").addEventListener("click", () => {
          const name = staffNameInput.value.trim();
          if (name) {
            currentStaff = name;
            currentStaffEl.textContent = `👤 Current: ${currentStaff}`;
          }
        });

        // ========== DISPLAY FUNCTIONS ==========
        function updateDisplay() {
          resultEl.innerText = currentInput;
        }

        function updatePaymentDisplay() {
          const total =
            parseFloat(orderTotalEl.textContent.replace("RM ", "")) || 0;
          const paid = cashAmount || 0;
          const change = paid - total;

          paidAmountEl.textContent = `RM ${paid.toFixed(2)}`;
          changeAmountEl.textContent = `RM ${Math.max(0, change).toFixed(2)}`;

          if (change < 0) {
            changeAmountEl.style.color = "#e1100b";
          } else {
            changeAmountEl.style.color = "#821e0e";
          }
        }

        function updateOrderDisplay() {
          if (currentOrder.length === 0) {
            orderListEl.innerHTML =
              '<div style="text-align:center; padding:10px; color:#666;">No items in order</div>';
            orderTotalEl.textContent = "RM 0.00";
          } else {
            let html = "";
            let total = 0;

            const grouped = {};
            currentOrder.forEach((item) => {
              const key = `${item.name}_${item.price}`;
              if (!grouped[key]) {
                grouped[key] = { ...item, qty: 1 };
              } else {
                grouped[key].qty++;
              }
            });

            Object.values(grouped).forEach((item) => {
              const itemTotal = item.price * item.qty;
              total += itemTotal;
              html += `<div class="order-item">
                          <span><strong>${item.qty}x</strong> ${item.name}</span>
                          <span>RM ${itemTotal.toFixed(2)}</span>
                      </div>`;
            });

            orderListEl.innerHTML = html;
            orderTotalEl.textContent = `RM ${total.toFixed(2)}`;
          }
          updatePaymentDisplay();
        }

        function updateDashboard() {
          const today = new Date().toDateString();
          let todayTotal = 0;
          let totalItems = 0;

          allSales.forEach((sale) => {
            if (new Date(sale.date).toDateString() === today) {
              todayTotal += sale.total;
            }
            totalItems += sale.items ? sale.items.length : 0;
          });

          todayTotalEl.textContent = `RM${todayTotal.toFixed(2)}`;
          totalSalesEl.textContent = allSales.length;
          totalItemsEl.textContent = totalItems;
        }

        // ========== CALCULATOR FUNCTIONS - FOR MANUAL PAYMENT ENTRY ==========
        function appendNumber(num) {
          if (shouldResetScreen) {
            currentInput = "";
            shouldResetScreen = false;
          }

          if (num === "." && currentInput.includes(".")) return;

          if (currentInput === "0" && num !== ".") {
            currentInput = num;
          } else {
            currentInput += num;
          }

          // Update cash amount as user types (manual entry)
          cashAmount = parseFloat(currentInput) || 0;
          updateDisplay();
          updatePaymentDisplay();
        }

        // Cash note buttons - QUICK BUTTONS for common amounts (RM10,20,50,100)
        function setCashAmount(amount) {
          cashAmount = amount;
          currentInput = amount.toString();
          shouldResetScreen = false;

          updateDisplay();
          updatePaymentDisplay();
        }

        // Calculator operations (for complex calculations if needed)
        function chooseOperation(op) {
          const currentValue = parseFloat(currentInput);
          if (isNaN(currentValue)) return;

          if (previousOperand === null) {
            previousOperand = currentValue;
          } else if (operator) {
            calculate();
          }

          operator = op;
          shouldResetScreen = true;
        }

        function calculate() {
          if (previousOperand === null || operator === null) return;

          const currentValue = parseFloat(currentInput);
          if (isNaN(currentValue)) return;

          let result;
          switch (operator) {
            case "+":
              result = previousOperand + currentValue;
              break;
            case "-":
              result = previousOperand - currentValue;
              break;
            case "*":
              result = previousOperand * currentValue;
              break;
            case "/":
              if (currentValue === 0) {
                alert("Cannot divide by zero");
                return;
              }
              result = previousOperand / currentValue;
              break;
            default:
              return;
          }

          currentInput = result.toString();
          cashAmount = parseFloat(currentInput); // Update cash amount with result
          previousOperand = null;
          operator = null;
          shouldResetScreen = true;
          updateDisplay();
          updatePaymentDisplay();
        }

        function clearCalculator() {
          currentInput = "0";
          previousOperand = null;
          operator = null;
          shouldResetScreen = false;
          cashAmount = null;
          updateDisplay();
          updatePaymentDisplay();
        }

        // ========== ORDER FUNCTIONS ==========
        function addToOrder(name, price) {
          // Add item to order
          currentOrder.push({ name, price, timestamp: new Date() });

          // Update order display
          updateOrderDisplay();
        }

        function voidLastItem() {
          if (currentOrder.length > 0) {
            currentOrder.pop();
            updateOrderDisplay();
          }
        }

        function clearOrder() {
          if (confirm("Clear current order?")) {
            currentOrder = [];
            cashAmount = null;
            clearCalculator();
            updateOrderDisplay();
          }
        }

        // ========== RECEIPT FUNCTION ==========
        function showReceipt(sale) {
          const modal = document.getElementById("receiptModal");
          document.getElementById("receiptDateTime").textContent =
            new Date().toLocaleString();
          document.getElementById("receiptStaff").textContent =
            `Staff: ${sale.staff || currentStaff}`;

          let itemsHtml = "";
          let total = 0;
          sale.items.forEach((item) => {
            itemsHtml += `<div class="receipt-item">
              <span>${item.name}</span>
              <span>RM ${item.price.toFixed(2)}</span>
            </div>`;
            total += item.price;
          });

          document.getElementById("receiptItems").innerHTML = itemsHtml;
          document.getElementById("receiptTotal").innerHTML =
            `Total: RM ${total.toFixed(2)}`;
          document.getElementById("receiptPaid").textContent =
            `RM ${(sale.paid || 0).toFixed(2)}`;
          document.getElementById("receiptChange").textContent =
            `RM ${Math.max(0, (sale.paid || 0) - total).toFixed(2)}`;
          document.getElementById("receiptRemarks").textContent =
            sale.remarks || "No remarks";

          modal.style.display = "flex";
        }

        // ========== DAILY REPORT ==========
        function showDailyReport() {
          const modal = document.getElementById("reportModal");
          const today = new Date().toDateString();
          const todaySales = allSales.filter(
            (s) => new Date(s.date).toDateString() === today,
          );

          let totalRevenue = 0;
          let totalItems = 0;
          let singles = 0;
          let families = 0;

          todaySales.forEach((sale) => {
            totalRevenue += sale.total;
            totalItems += sale.items.length;
            sale.items.forEach((item) => {
              if (item.name.includes("Single")) singles++;
              if (item.name.includes("Family")) families++;
            });
          });

          document.getElementById("reportDate").innerHTML =
            `<strong>${today}</strong>`;
          document.getElementById("reportStats").innerHTML = `
            <div>Total Sales: ${todaySales.length}</div>
            <div>Total Revenue: RM ${totalRevenue.toFixed(2)}</div>
            <div>Total Items: ${totalItems}</div>
            <div>Singles Sold: ${singles}</div>
            <div>Families Sold: ${families}</div>
            <div>Average Order: RM ${todaySales.length ? (totalRevenue / todaySales.length).toFixed(2) : 0}</div>
          `;

          let salesList = '<h3 style="margin-top:20px;">Transactions:</h3>';
          todaySales.forEach((sale, i) => {
            salesList += `<div style="border-top:1px solid #ccc; padding:10px;">
              <div>${new Date(sale.date).toLocaleTimeString()}</div>
              <div>Items: ${sale.items.length} | Total: RM ${sale.total.toFixed(2)}</div>
              <div style="font-size:0.9rem; color:#666;">${sale.remarks || "No remarks"}</div>
            </div>`;
          });

          document.getElementById("reportSalesList").innerHTML = salesList;
          modal.style.display = "flex";
        }

        // ========== SALE FUNCTIONS ==========
        function saveSale() {
          if (currentOrder.length === 0) {
            alert("No items in order!");
            return;
          }

          const total = parseFloat(orderTotalEl.textContent.replace("RM ", ""));
          const now = new Date();
          const saleRecord = {
            id: Date.now(),
            date: now.toISOString(),
            datetime: now.toLocaleString("en-MY"),
            items: [...currentOrder],
            total: total,
            paid: cashAmount || 0,
            change: Math.max(0, (cashAmount || 0) - total),
            staff: currentStaff,
            remarks: saleRemarks.value || "No remarks",
          };

          allSales.push(saleRecord);
          localStorage.setItem("churrosSales", JSON.stringify(allSales));

          // Show receipt
          showReceipt(saleRecord);

          // Clear everything
          currentOrder = [];
          cashAmount = null;
          saleRemarks.value = "";
          clearCalculator();
          updateOrderDisplay();
          updateDashboard();
        }

        // ========== EXPORT FUNCTION ==========
        function exportToExcel() {
          if (allSales.length === 0) {
            alert("No sales data to export");
            return;
          }

          let csv =
            "Date,Time,Staff,Items,Total (RM),Paid (RM),Change (RM),Remarks\n";
          let grandTotal = 0;

          allSales.forEach((sale) => {
            const date = new Date(sale.date);
            const dateStr = date.toLocaleDateString("en-MY");
            const timeStr = date.toLocaleTimeString("en-MY");
            let itemsList = sale.items.map((i) => i.name).join(" + ");

            csv += `"${dateStr}","${timeStr}","${sale.staff || "Unknown"}","${itemsList}",${sale.total.toFixed(2)},${sale.paid.toFixed(2)},${sale.change.toFixed(2)},"${sale.remarks || ""}"\n`;
            grandTotal += sale.total;
          });

          csv += `\n"GRAND TOTAL","","","",${grandTotal.toFixed(2)},,,`;

          const blob = new Blob(["\uFEFF" + csv], {
            type: "text/csv;charset=utf-8;",
          });
          const url = window.URL.createObjectURL(blob);
          const a = document.createElement("a");
          const now = new Date();
          const filename = `churros_sales_${now.getFullYear()}-${(now.getMonth() + 1).toString().padStart(2, "0")}-${now.getDate().toString().padStart(2, "0")}.csv`;

          a.href = url;
          a.download = filename;
          document.body.appendChild(a);
          a.click();
          document.body.removeChild(a);
          window.URL.revokeObjectURL(url);
        }

        function resetAllData() {
          if (confirm("⚠️ Reset ALL sales data? This cannot be undone!")) {
            allSales = [];
            localStorage.removeItem("churrosSales");
            currentOrder = [];
            cashAmount = null;
            clearCalculator();
            updateOrderDisplay();
            updateDashboard();
            alert("All data cleared");
          }
        }

        // ========== EVENT LISTENERS ==========
        // Number buttons - for MANUAL ENTRY of any amount (RM25, RM43, etc)
        document.querySelectorAll("[data-num]").forEach((btn) => {
          btn.addEventListener("click", () => appendNumber(btn.dataset.num));
        });

        // Operator buttons (for calculations)
        document.querySelectorAll("[data-op]").forEach((btn) => {
          btn.addEventListener("click", () => chooseOperation(btn.dataset.op));
        });

        // Equals button
        document
          .getElementById("equals-btn")
          .addEventListener("click", calculate);

        // Clear button
        document
          .getElementById("clear-btn")
          .addEventListener("click", clearCalculator);

        // Cash note buttons - QUICK BUTTONS for common amounts
        document
          .getElementById("note-10")
          .addEventListener("click", () => setCashAmount(10));
        document
          .getElementById("note-20")
          .addEventListener("click", () => setCashAmount(20));
        document
          .getElementById("note-50")
          .addEventListener("click", () => setCashAmount(50));
        document
          .getElementById("note-100")
          .addEventListener("click", () => setCashAmount(100));

        // Meal buttons - choose items
        document
          .getElementById("meal-single")
          .addEventListener("click", () => addToOrder("Single Set", 7));
        document
          .getElementById("meal-family")
          .addEventListener("click", () => addToOrder("Family Box", 35));

        // Void last item
        document
          .getElementById("void-last")
          .addEventListener("click", voidLastItem);

        // Clear order
        document
          .getElementById("clear-order")
          .addEventListener("click", clearOrder);
        document
          .getElementById("reset-btn")
          .addEventListener("click", resetAllData);

        // Save and export
        document
          .getElementById("save-sale")
          .addEventListener("click", saveSale);
        document
          .getElementById("export-btn")
          .addEventListener("click", exportToExcel);

        // Daily Report
        document
          .getElementById("daily-report")
          .addEventListener("click", showDailyReport);

        // Initialize
        updateDisplay();
        updateOrderDisplay();
        updateDashboard();
      })();
    </script>
  </body>
</html>
